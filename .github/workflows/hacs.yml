name: HACS Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' only matters for HACS DEFAULT-store listing (needs the domain
          # in the home-assistant/brands repo). This installs fine as a HACS custom
          # repository, so skip that check. Submit to brands later for default-store.
          ignore: brands
